<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="diviGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="elemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92003B"/>
      <stop offset="100%" stop-color="#D40054"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#6C2BD9"/>
      <stop offset="100%" stop-color="#D40054"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgb(255 255 255 / 0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Centered divider line -->
  <line x1="600" y1="80" x2="600" y2="550" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>

  <!-- VS Badge -->
  <rect x="554" y="275" width="92" height="60" rx="12" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="315" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="white" letter-spacing="2">VS</text>

  <!-- Left: Divi -->
  <text x="300" y="160" text-anchor="middle" font-family="Archivo, sans-serif" font-size="64" font-weight="700" fill="url(#diviGrad)">Divi 5</text>

  <!-- Divi mock cards -->
  <rect x="100" y="200" width="170" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="110" y="212" width="60" height="8" rx="4" fill="#3B82F6" opacity="0.6"/>
  <rect x="110" y="228" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="110" y="240" width="100" height="6" rx="3" fill="#475569"/>
  <rect x="110" y="254" width="80" height="6" rx="3" fill="#334155"/>

  <rect x="330" y="200" width="170" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="340" y="212" width="60" height="8" rx="4" fill="#3B82F6" opacity="0.6"/>
  <rect x="340" y="228" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="340" y="240" width="100" height="6" rx="3" fill="#475569"/>
  <rect x="340" y="254" width="80" height="6" rx="3" fill="#334155"/>

  <!-- Divi stats -->
  <text x="300" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#94A3B8">$249 Lifetime</text>
  <text x="300" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#64748B">Unlimited sites</text>

  <!-- Right: Elementor -->
  <text x="900" y="160" text-anchor="middle" font-family="Archivo, sans-serif" font-size="64" font-weight="700" fill="url(#elemGrad)">Elementor</text>

  <!-- Elementor mock cards -->
  <rect x="700" y="200" width="170" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="710" y="212" width="60" height="8" rx="4" fill="#D40054" opacity="0.6"/>
  <rect x="710" y="228" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="710" y="240" width="100" height="6" rx="3" fill="#475569"/>
  <rect x="710" y="254" width="80" height="6" rx="3" fill="#334155"/>

  <rect x="930" y="200" width="170" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="940" y="212" width="60" height="8" rx="4" fill="#D40054" opacity="0.6"/>
  <rect x="940" y="228" width="140" height="6" rx="3" fill="#475569"/>
  <rect x="940" y="240" width="100" height="6" rx="3" fill="#475569"/>
  <rect x="940" y="254" width="80" height="6" rx="3" fill="#334155"/>

  <!-- Elementor stats -->
  <text x="900" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#94A3B8">$444/year</text>
  <text x="900" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#64748B">Unlimited sites</text>

  <!-- Bottom line -->
  <text x="600" y="500" text-anchor="middle" font-family="Archivo, sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">Which page builder actually earns you more?</text>
  <text x="600" y="540" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#64748B">An honest comparison from a Divi freelancer with 100+ projects</text>

  <!-- Brand -->
  <text x="600" y="45" text-anchor="middle" font-family="Archivo, sans-serif" font-size="14" font-weight="600" fill="#475569">DIVIDESIGNPRO BLOG</text>
</svg>